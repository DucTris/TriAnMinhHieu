  <title>Trí ❤️ Hiếu</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #26050d;
      --deep-wine: #160207;
      --rose: #c83f5d;
      --gold: #f5d595;
      --cream: #fff7e7;
    }

    * { box-sizing: border-box; }

    html { background: var(--deep-wine); }

    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow-x: hidden;
      font-family: "DM Sans", sans-serif;
    }

    .poster-stage {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: clamp(1rem, 3vw, 3rem);
      overflow: hidden;
      isolation: isolate;
    }

    .poster-stage::before,
    .poster-stage::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(4px);
      z-index: -1;
    }

    .poster-stage::before {
      width: min(80vw, 980px);
      height: min(80vw, 980px);
      background: radial-gradient(circle, rgba(211, 64, 93, .35), rgba(107, 10, 34, .03) 68%);
      animation: pulseGlow 7s ease-in-out infinite;
    }

    .poster-stage::after {
      width: 36rem;
      height: 36rem;
      right: -16rem;
      bottom: -16rem;
      background: radial-gradient(circle, rgba(245, 213, 149, .17), transparent 68%);
    }

    .poster-card {
      width: min(100%, 1020px);
      min-height: min(760px, calc(92 * min(var(--vh, 1vh), 1vh)));
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid rgba(245, 213, 149, .8);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .48), inset 0 0 80px rgba(255, 202, 175, .06);
      padding: clamp(1.15rem, 3vw, 2.35rem);
      animation: enterPoster .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .poster-card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(245, 213, 149, .36);
      pointer-events: none;
    }

    .poster-card::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .55;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 25px 25px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
    }

    .top-line,
    .bottom-line {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 1rem;
      white-space: nowrap;
      overflow: hidden;
    }

    .line-rule {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(245, 213, 149, .8), transparent);
    }

    .side-text {
      position: absolute;
      z-index: 1;
      top: 50%;
      color: rgba(255, 241, 212, .72);
      font-family: "DM Sans", sans-serif;
      font-size: clamp(.66rem, 1vw, .78rem);
      letter-spacing: .3em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: translateY(-50%);
    }

    .side-left { left: clamp(.8rem, 2vw, 1.5rem); }
    .side-right { right: clamp(.8rem, 2vw, 1.5rem); transform: translateY(-50%) rotate(180deg); }

    .centerpiece {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3.5rem clamp(1rem, 6vw, 6.25rem);
    }

    .orbital-ring {
      width: clamp(215px, 37vw, 410px);
      aspect-ratio: 1;
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(245, 213, 149, .32);
      box-shadow: 0 0 0 14px rgba(245, 213, 149, .025), 0 0 80px rgba(236, 93, 122, .2);
      animation: rotateRing 25s linear infinite;
    }

    .orbital-ring::before,
    .orbital-ring::after {
      content: "✦";
      position: absolute;
      color: var(--gold);
      font-size: 1.1rem;
      text-shadow: 0 0 15px rgba(245, 213, 149, .8);
    }

    .orbital-ring::before { top: 10%; left: 9%; }
    .orbital-ring::after { bottom: 10%; right: 9%; }

    .heart-mark {
      color: var(--gold);
      font-size: clamp(1.1rem, 2vw, 1.75rem);
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 15px rgba(245, 213, 149, .55));
      animation: heartBeat 2s ease-in-out infinite;
    }

    .main-title {
      position: relative;
      margin: 0;
      max-width: 100%;
      color: var(--cream);
      font-family: "Playfair Display", serif;
      font-size: clamp(3.8rem, 11.2vw, 8.4rem);
      font-weight: 700;
      line-height: .9;
      letter-spacing: -.065em;
      text-wrap: balance;
      text-shadow: 0 4px 0 rgba(85, 8, 27, .5), 0 0 35px rgba(255, 232, 194, .18);
      animation: revealTitle 1s .2s cubic-bezier(.2,.8,.2,1) both;
    }

    .main-title .red-heart {
      color: #f0506e;
      display: inline-block;
      font-family: "DM Sans", sans-serif;
      font-size: .54em;
      vertical-align: .08em;
      margin: 0 .06em;
      filter: drop-shadow(0 0 12px rgba(240, 80, 110, .65));
    }

    .subtitle-band {
      margin-top: 2rem;
      padding: .7rem 1.15rem;
      border-top: 1px solid rgba(245, 213, 149, .6);
      border-bottom: 1px solid rgba(245, 213, 149, .6);
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px 2px rgba(245, 213, 149, .6);
      animation: twinkle 2.8s ease-in-out infinite alternate;
    }

    .spark-1 { top: 20%; left: 19%; animation-delay: .2s; }
    .spark-2 { top: 29%; right: 17%; animation-delay: 1.1s; }
    .spark-3 { bottom: 23%; left: 24%; animation-delay: .7s; }
    .spark-4 { bottom: 17%; right: 27%; animation-delay: 1.7s; }

    @keyframes enterPoster {
      from { opacity: 0; transform: translateY(20px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes revealTitle {
      from { opacity: 0; transform: translateY(18px); letter-spacing: -.02em; }
      to { opacity: 1; transform: translateY(0); letter-spacing: -.065em; }
    }

    @keyframes rotateRing { to { transform: rotate(360deg); } }
    @keyframes pulseGlow { 50% { transform: scale(1.11); opacity: .78; } }
    @keyframes heartBeat { 50% { transform: scale(1.16); } }
    @keyframes twinkle { from { opacity: .25; transform: scale(.7); } to { opacity: 1; transform: scale(1.55); } }

    @media (max-width: 520px) {
      .poster-card { min-height: calc(88 * min(var(--vh, 1vh), 1vh)); }
      .side-text { display: none; }
      .centerpiece { padding-inline: .4rem; }
      .subtitle-band { margin-top: 1.5rem; }
    }
  </style>
